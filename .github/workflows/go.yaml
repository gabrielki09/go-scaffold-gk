name: Go CLI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Configura o Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - name: Baixa as dependências
        run: go mod download

      - name: Verifca formatação
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Arquivos não formatados:"
            echo "$files"
            exit 1
          fi
        
      - name: Verifica go vet
        run: go vet ./...

      - name: Roda build
        run: go build ./...

